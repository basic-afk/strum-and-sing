<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Strum &amp; Sing</title>
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Strum &amp; Sing"><meta name="theme-color" content="#5b2a1e">
<link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" href="icon-512.png">

<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/*
VOICE: a patient guitar-and-voice teacher; short, warm, plain words; bold for the one thing to remember.
IDEA: the guitar itself — the lesson path is a rosewood neck with frets; tools behave like a clip-on tuner and a practice notebook.
PICTURE: each tool opens on its working instrument: the tuner dial, the live pitch line, the chord box, the beat strip.
COLOUR and TYPE: white ground, rosewood dominant, spruce support, one teal "in tune" accent; blue = too low, orange = too high. Lexend for easy reading.
LAYOUT: one calm column (max 760px), bottom tab bar on phones, big 48px targets, stacked controls below 600px.
*/
:root{color-scheme:light dark;
--bg:light-dark(#ffffff,#161110);--panel:light-dark(#f6f4f1,#211a17);--panel2:light-dark(#eeeae5,#2b221e);
--ink:light-dark(#1f1714,#f4ece6);--muted:light-dark(#6b605a,#b8aaa1);--line:light-dark(#e3ddd6,#3b302b);
--wood:light-dark(#5b2a1e,#7a3b2a);--wood2:light-dark(#43201a,#5d2c20);--woodink:#fff7f0;
--spruce:light-dark(#f3ddb0,#e6c88e);--fret:light-dark(#cfc8c0,#b9aea6);
--ok:light-dark(#0b8a7a,#3ccbb4);--okbg:light-dark(#e2f4f1,#123a34);
--low:light-dark(#2a62d4,#7aa4ff);--high:light-dark(#d4531c,#ff8d58);--warnbg:light-dark(#fff0e7,#3d2418);
--tabon:light-dark(#5b2a1e,#e6c88e);--r:16px}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{scroll-padding-top:72px;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 Lexend,system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:clip;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
button,input,select{font:inherit;color:inherit}
input[type=checkbox]{accent-color:var(--wood)}
b,strong{font-weight:700}u{text-decoration-thickness:2px;text-underline-offset:3px}
.wrap{max-width:760px;margin:0 auto;padding:0 max(4vw,16px)}
header.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:10px;min-height:58px}
.brand{font-weight:700;font-size:19px;display:flex;align-items:center;gap:8px;flex:1;text-decoration:none;color:inherit}
.brand svg{flex:none}
.chip-mic{font-size:13px;padding:4px 10px;border-radius:99px;background:var(--panel2);color:var(--muted);white-space:nowrap}
.chip-mic.live{background:var(--okbg);color:var(--ok)}
.iconbtn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);display:grid;place-items:center;cursor:pointer;flex:none;text-decoration:none;font-size:22px}
.iconbtn svg{width:24px;height:24px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .wrap{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding:0}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 2px 8px;font-size:12.5px;color:var(--muted);text-decoration:none;min-height:60px}
nav.tabs a[aria-current=page]{color:var(--tabon);font-weight:700}
nav.tabs svg{width:26px;height:26px}
h1{font-size:clamp(28px,6vw,40px);line-height:1.08;margin:0 0 6px;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:22px;line-height:1.2;margin:0 0 10px}
h3{font-size:18px;margin:0 0 6px}
p{margin:0 0 12px}
.sub{color:var(--muted);font-size:15px}
.band{padding-top:22px;padding-bottom:22px}
.card{background:var(--panel);border-radius:var(--r);padding:16px;margin:0 0 14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 18px;border-radius:14px;border:0;background:var(--wood);color:var(--woodink);font-weight:600;cursor:pointer;text-decoration:none;text-align:center}
.btn.alt{background:var(--panel2);color:var(--ink)}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.ok{background:var(--ok);color:#fff}
.btn.big{min-height:56px;font-size:18px;padding:12px 22px}
.btn[disabled]{opacity:.45;cursor:default}
.btn.on{background:var(--ok);color:#fff}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row>.grow{flex:1 1 160px}
:focus-visible{outline:3px solid var(--ok);outline-offset:2px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;min-height:44px;padding:8px 15px;border-radius:99px;border:1.5px solid var(--line);background:var(--bg);cursor:pointer;font-size:15.5px;white-space:nowrap}
.chips button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chips button .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);margin-left:6px;vertical-align:middle}
/* today band */
.today{background:var(--wood);color:var(--woodink);border-radius:0 0 26px 26px;padding:22px 0 18px;position:relative;overflow:hidden}
.today::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;border:26px solid rgba(255,255,255,.06)}
.today h1{color:var(--woodink)}
.today .sub{color:color-mix(in srgb,var(--woodink) 75%,transparent)}
.plan{list-style:none;margin:14px 0 4px;padding:0;display:grid;gap:8px;position:relative;z-index:1}
.plan li{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.08);border-radius:14px;padding:6px 8px 6px 6px}
.plan .tick{width:44px;height:44px;border-radius:50%;border:2.5px solid var(--spruce);background:transparent;flex:none;cursor:pointer;display:grid;place-items:center;color:var(--wood2)}
.plan li.done .tick{background:var(--spruce)}
.plan li.done .lbl{opacity:.7;text-decoration:line-through}
.plan .lbl{flex:1;font-size:16px;line-height:1.3}
.plan .lbl small{display:block;opacity:.75;font-size:13px}
.plan .go{min-height:44px;padding:6px 14px;border-radius:12px;border:0;background:var(--spruce);color:#3a1d14;font-weight:700;cursor:pointer}
.streak{display:flex;gap:18px;margin-top:12px;font-size:14px;position:relative;z-index:1;flex-wrap:wrap}
.streak b{font-size:22px;display:block;line-height:1}
/* lesson path: a guitar neck */
.path{position:relative;margin-top:8px}
.unit{position:relative;padding-left:58px}
.unit::before{content:"";position:absolute;left:14px;top:0;bottom:0;width:30px;background:linear-gradient(90deg,var(--wood2),var(--wood) 45%,var(--wood2));}
.unit:first-child::before{border-radius:10px 10px 0 0;border-top:7px solid var(--spruce)}
.unit:last-child::before{border-radius:0 0 10px 10px}
.unit h3{padding:16px 0 6px;color:var(--muted);font-size:14px;font-weight:600;position:relative}
.unit h3::before{content:"";position:absolute;left:-37px;top:20px;width:12px;height:12px;border-radius:50%;background:var(--spruce);box-shadow:0 1px 0 rgba(0,0,0,.4)}
.fret{position:relative;display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 12px;margin:0 0 8px;border-radius:14px;background:var(--panel);border:0;cursor:pointer;min-height:60px;text-decoration:none;color:inherit}
.fret::before{content:"";position:absolute;left:-44px;width:30px;top:50%;height:3px;background:var(--fret);box-shadow:0 1px 0 rgba(0,0,0,.35)}
.fret .num{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:15px;background:var(--bg);border:2px solid var(--line);flex:none}
.fret.done .num{background:var(--ok);border-color:var(--ok);color:#fff}
.fret.now{outline:2.5px solid var(--wood);background:var(--bg)}
.fret .t{flex:1;line-height:1.3}
.fret .t small{display:block;color:var(--muted);font-size:13px}
/* lesson */
.lesson .back{margin:14px 0 6px}
.pts{list-style:none;padding:0;margin:14px 0;display:grid;gap:12px}
.pts li{background:var(--panel);border-radius:14px;padding:12px 14px 12px 48px;position:relative;font-size:17.5px;line-height:1.55}
.pts li::before{content:counter(p);counter-increment:p;position:absolute;left:12px;top:12px;width:26px;height:26px;border-radius:50%;background:var(--spruce);color:#3a1d14;font-weight:700;font-size:14px;display:grid;place-items:center}
.pts{counter-reset:p}
.art{margin:12px 0;background:var(--panel);border-radius:var(--r);padding:12px;overflow:hidden}
.art svg{display:block;width:100%;height:auto}
.keys{display:flex;gap:3px;height:118px;position:relative;margin-top:8px;user-select:none;-webkit-user-select:none}
.keys button{flex:1;border:1px solid var(--line);border-radius:0 0 8px 8px;background:#fff;color:#333;display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px;font-size:13px;cursor:pointer}
.keys button.blk{position:absolute;top:0;height:62%;background:#2a201c;color:#eee;border-radius:0 0 6px 6px;z-index:2;font-size:11px}
.keys.many button{font-size:9.5px;padding-bottom:5px}
.keys button.hit{background:var(--spruce)}.keys button.blk.hit{background:var(--wood)}
.keys button.inr{background:color-mix(in srgb,var(--ok) 28%,#fff)}
/* tuner */
.tuner{display:grid;place-items:center;padding:8px 0 4px}
.tuner svg{width:min(100%,460px);height:auto;display:block}
.needle{transition:transform .12s linear;transform-origin:200px 210px}
@media(prefers-reduced-motion:reduce){.needle{transition:none}}
.readout{text-align:center;margin-top:-8px}
.readout .nn{font-size:64px;font-weight:700;line-height:1}
.readout .hint{font-size:20px;font-weight:600;min-height:32px}
.strings{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin:14px 0}
.strings.six{grid-template-columns:repeat(6,minmax(0,1fr))}
.strings button{min-height:56px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);cursor:pointer;line-height:1.1;font-weight:700;font-size:17px}
.strings button small{display:block;font-size:11px;font-weight:400;color:var(--muted)}
.strings button[aria-pressed=true]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.strings button[aria-pressed=true] small{color:inherit}
.strings button.good{box-shadow:inset 0 -5px 0 var(--ok)}
.c-ok{color:var(--ok)}.c-low{color:var(--low)}.c-high{color:var(--high)}
/* pitch trace */
.fig{position:relative;min-height:300px;background:var(--panel);border-radius:var(--r);overflow:hidden}
.fig>canvas{position:absolute;inset:0;width:100%;height:100%}
.fig .over{position:absolute;right:12px;top:10px;text-align:right;pointer-events:none}
.fig .over .nn{font-size:40px;font-weight:700;line-height:1}
.fig .over .cc{font-size:15px;font-weight:600}
.fig .msg{position:absolute;left:12px;bottom:10px;right:12px;font-size:15px;color:var(--muted);pointer-events:none}
.hold{height:12px;border-radius:99px;background:var(--panel2);overflow:hidden;margin:10px 0}
.hold i{display:block;height:100%;width:0;background:var(--ok);transition:width .1s}
.bubbles{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.bubbles button{min-width:48px;min-height:52px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);cursor:pointer;line-height:1.1;padding:4px 8px}
.bubbles button small{display:block;font-size:11px;color:var(--muted)}
.bubbles button.cur{border-color:var(--wood);border-width:3px}
.bubbles button.ok{background:var(--okbg);border-color:var(--ok)}
.bubbles button.lo{background:color-mix(in srgb,var(--low) 14%,var(--bg));border-color:var(--low)}
.bubbles button.hi{background:var(--warnbg);border-color:var(--high)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:10px 0}
.stats div{background:var(--panel);border-radius:14px;padding:10px;text-align:center;font-size:13px;color:var(--muted)}
.stats b{display:block;font-size:24px;color:var(--ink)}
/* chords */
.chordwrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:center}
@media(max-width:600px){.chordwrap{grid-template-columns:1fr}}
.cbox{background:var(--panel);border-radius:var(--r);padding:10px;display:grid;place-items:center}
.cbox svg{width:min(100%,280px);height:auto}
.cname{font-size:48px;font-weight:700;line-height:1}
.result{border-radius:14px;padding:12px 14px;margin:12px 0;font-size:17px}
.result.good{background:var(--okbg)}.result.close,.result.other{background:var(--warnbg)}.result.info{background:var(--panel)}
.result ul{margin:6px 0 0;padding-left:20px}
.timer{font-size:72px;font-weight:700;text-align:center;line-height:1;font-variant-numeric:tabular-nums}
.countbtn{width:100%;min-height:120px;font-size:34px;border-radius:20px}
.spark{display:block;width:100%;height:44px}
/* rhythm */
.beats{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:5px;margin:12px 0}
.beats div{border-radius:12px;background:var(--panel);text-align:center;padding:8px 0 6px;font-size:13px;color:var(--muted)}
.beats div b{display:block;font-size:30px;line-height:1.1;color:var(--ink)}
.beats div.on{background:var(--wood);color:var(--woodink)}.beats div.on b{color:var(--woodink)}
.beats div.air b{opacity:.25}
.bpm{display:flex;align-items:center;gap:10px;justify-content:center}
.bpm .v{font-size:56px;font-weight:700;min-width:110px;text-align:center;font-variant-numeric:tabular-nums;line-height:1}
input[type=range]{width:100%;accent-color:var(--wood);height:32px}
.nowchord{display:flex;align-items:baseline;gap:14px;justify-content:center;min-height:64px}
.nowchord b{font-size:54px;line-height:1}
.pad{width:100%;min-height:130px;border-radius:22px;font-size:24px;border:0;background:var(--panel2);cursor:pointer;touch-action:manipulation}
.pad:active{background:var(--spruce)}
/* progress */
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:12px 0}
.kpis div{background:var(--panel);border-radius:16px;padding:14px 10px;text-align:center;font-size:13px;color:var(--muted)}
.kpis b{display:block;font-size:30px;color:var(--ink);line-height:1.1}
.bars{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;align-items:end;height:130px;margin:8px 0 4px}
.bars div{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:12px;color:var(--muted);gap:4px}
.bars i{display:block;width:70%;background:var(--wood);border-radius:6px 6px 2px 2px;min-height:3px}
.bars div.cur i{background:var(--ok)}
table{width:100%;border-collapse:collapse;font-size:15px}
td,th{padding:9px 6px;border-bottom:1px solid var(--line);text-align:left}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.set{display:grid;gap:14px}
.set label{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.fallback{border:2px dashed var(--line);border-radius:var(--r);padding:14px;margin:12px 0}
.fallback h3{margin-bottom:4px}
.hidden{display:none!important}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:14px;z-index:50;font-size:15px;max-width:90vw;text-align:center}
.breath{display:grid;place-items:center;gap:10px;padding:8px}
.breath .ball{width:120px;height:120px;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--spruce),var(--wood));transform:scale(.55);transition:transform 4s ease-in-out}
.breath .say{font-size:22px;font-weight:700;min-height:34px}
.chart{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.chart div{background:var(--bg);border-radius:12px;padding:8px;text-align:center}
.chart b{font-size:26px;display:block}
.chart span{font-size:14px;color:var(--muted)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media(max-width:600px){h1{font-size:30px}.readout .nn{font-size:56px}.timer{font-size:60px}}

</style></head><body>

<span id="probe" class="vh" aria-hidden="true"></span>
<script>
{
/* ===== DSP: pitch (YIN) + chord check (chroma + per-string evidence) ===== */
const DSP = (() => {
  const NAMES = ['C','C♯','D','D♯','E','F','F♯','G','G♯','A','A♯','B'];
  const state = { a4: 440 };
  const f2m = (f) => 69 + 12 * Math.log2(f / state.a4);
  const m2f = (m) => state.a4 * Math.pow(2, (m - 69) / 12);
  const pc = (m) => ((Math.round(m) % 12) + 12) % 12;
  const name = (m) => NAMES[pc(m)] + (Math.floor(Math.round(m) / 12) - 1);
  const pcName = (p) => NAMES[((p % 12) + 12) % 12];

  function rms(b, from = 0, to = b.length) {
    let s = 0; for (let i = from; i < to; i++) s += b[i] * b[i];
    return Math.sqrt(s / Math.max(1, to - from));
  }

  /* YIN (de Cheveigné & Kawahara 2002): difference fn -> cumulative mean
     normalised difference -> absolute threshold -> parabolic interpolation */
  let dBuf = new Float32Array(0), cBuf = new Float32Array(0);
  function yin(buf, sr, opt = {}) {
    const fmin = opt.fmin || 60, fmax = opt.fmax || 1100, th = opt.threshold || 0.12;
    const N = buf.length;
    const tauMax = Math.min(Math.floor(sr / fmin), Math.floor(N / 2));
    const tauMin = Math.max(2, Math.floor(sr / fmax));
    const W = N - tauMax;
    if (dBuf.length < tauMax + 2) { dBuf = new Float32Array(tauMax + 2); cBuf = new Float32Array(tauMax + 2); }
    const d = dBuf, c = cBuf;
    for (let t = 1; t <= tauMax; t++) {
      let s = 0;
      for (let j = 0; j < W; j++) { const x = buf[j] - buf[j + t]; s += x * x; }
      d[t] = s;
    }
    c[0] = 1; let run = 0;
    for (let t = 1; t <= tauMax; t++) { run += d[t]; c[t] = run > 0 ? d[t] * t / run : 1; }
    let tau = -1;
    for (let t = tauMin; t < tauMax; t++) {
      if (c[t] < th) { while (t + 1 < tauMax && c[t + 1] < c[t]) t++; tau = t; break; }
    }
    if (tau < 0) { // no dip under threshold: take the first dip close to the deepest one
      let best = tauMin;
      for (let t = tauMin; t < tauMax; t++) if (c[t] < c[best]) best = t;
      if (c[best] > 0.3) return { f0: 0, clarity: 1 - c[best] };
      const lim = c[best] + 0.06;
      for (let t = tauMin; t <= best; t++) if (c[t] < lim) { while (t + 1 < tauMax && c[t + 1] < c[t]) t++; tau = t; break; }
    }
    let bt = tau;
    if (tau > 1 && tau < tauMax) {
      const s0 = c[tau - 1], s1 = c[tau], s2 = c[tau + 1], den = s0 + s2 - 2 * s1;
      if (Math.abs(den) > 1e-12) bt = tau + (s0 - s2) / (2 * den);
    }
    return { f0: sr / bt, clarity: 1 - c[tau] };
  }

  /* Smoother: median of recent readings (in cents) with jump rejection */
  function makeSmoother(size = 5) {
    const hist = []; let miss = 0;
    return {
      push(f0) {
        if (!f0) { if (++miss > 3) hist.length = 0; return hist.length ? median() : 0; }
        miss = 0;
        const m = f2m(f0);
        if (hist.length >= 3) {
          const med = f2m(median());
          // a lone octave jump is usually a detection slip: wait for confirmation
          if (Math.abs(m - med) > 7 && !this._pend) { this._pend = m; return median(); }
          if (this._pend && Math.abs(m - this._pend) > 1) { this._pend = 0; return median(); }
          if (this._pend) { hist.length = 0; this._pend = 0; }
        }

  /* Radix-2 FFT magnitude with Hann window */
  function fftMag(x) {
    let N = 1; while (N < x.length) N <<= 1;
    const re = new Float64Array(N), im = new Float64Array(N);
    for (let i = 0; i < x.length; i++) re[i] = x[i] * (0.5 - 0.5 * Math.cos(2 * Math.PI * i / (x.length - 1)));
    for (let i = 1, j = 0; i < N; i++) {
      let bit = N >> 1; for (; j & bit; bit >>= 1) j ^= bit; j ^= bit;
      if (i < j) { let t = re[i]; re[i] = re[j]; re[j] = t; }
    }
    for (let len = 2; len <= N; len <<= 1) {
      const ang = -2 * Math.PI / len, wr = Math.cos(ang), wi = Math.sin(ang);
      for (let i = 0; i < N; i += len) {
        let cr = 1, ci = 0;
        for (let k = 0; k < len / 2; k++) {

          re[b] = re[a] - tr; im[b] = im[a] - ti; re[a] += tr; im[a] += ti;

    for (let k = 0; k < N / 2; k++) mag[k] = Math.hypot(re[k], im[k]);

  function bandPeak(mag, N, sr, f, cents = 35) {
    const lo = Math.max(1, Math.floor(f * Math.pow(2, -cents / 1200) * N / sr));
    const hi = Math.min(mag.length - 1, Math.ceil(f * Math.pow(2, cents / 1200) * N / sr));
    let m = 0; for (let k = lo; k <= hi; k++) if (mag[k] > m) m = mag[k];

  function chroma(mag, N, sr, fmin = 70, fmax = 1500) {

    for (let k = k0; k <= k1; k++) {
      const v = mag[k] - 2 * floor; if (v <= 0) continue;
      const m = f2m(k * sr / N), r = Math.round(m), dev = m - r;

    const sorted = Array.from(mag.subarray(k0, k1)).sort((a, b) => a - b);
    const floor = sorted[sorted.length >> 1] || 0;

      const v = mag[k];
      if (v < mx * 0.03 || v < floor * 6) continue;
      if (!(v > mag[k - 1] && v >= mag[k + 1] && v >= mag[k - 2] && v >= mag[k + 2])) continue;
      const a = mag[k - 1], b = v, c = mag[k + 1], den = a - 2 * b + c;

  function explain(pk, notes) {

    for (const p of pk) {
      tot += p.a;
      let ok = false;
      for (const m of notes) { const f = m2f(m); const h = Math.round(p.f / f); if (h >= 1 && h <= 12 && near(p.f, h * f, 30 + 2 * h)) { ok = true; break; } }
      if (ok) got += p.a; else left.push(p);

  }

  const OPEN = [40, 45, 50, 55, 59, 64];
  const notesOf = (shape) => shape.map((f, i) => (f >= 0 ? OPEN[i] + f : null)).filter((m) => m !== null);

  /* Check a strummed chord against its shape.

      if (fr < 0) return { s, state: 'skip' };
      const m = OPEN[i] + fr, f = m2f(m);
      const masked = want.some((o) => o < m && [2, 3, 4, 5, 6, 8].some((h) => near(f, h * m2f(o), 25)));

        const masked2 = want.some((o) => o !== m && o < m + 12 && [1, 2, 3, 4, 5, 6].some((h) => near(2 * f, h * m2f(o), 25)));
        if (!masked2) e = Math.max(e, pkAt(2 * f));
      }
      if (masked) return { s, state: 'shared', e };
      return { s, state: e < 0.04 ? 'quiet' : 'ok', e };
    });

    let fix = null;
    if (base.leftE > tLeft) {
      shape.forEach((fr, i) => {
        const s = 6 - i, cands = [];
        if (fr < 0) cands.push({ m: OPEN[i], why: `string ${s} is ringing — don't strum it`, kind: 'ring' });
        if (fr > 0) {
          cands.push({ m: OPEN[i] + fr + 1, why: `string ${s}: finger is one fret too high`, kind: 'fret' });
          cands.push({ m: OPEN[i] + fr - 1, why: `string ${s}: finger is one fret too low`, kind: 'fret' });
          if (fr > 1) cands.push({ m: OPEN[i], why: `string ${s}: finger isn't pressing — the open string sounds`, kind: 'open' });
        }
        for (const c of cands) {
          const notes = fr < 0 ? want.concat(c.m) : want.map((m) => (m === OPEN[i] + fr ? c.m : m));
          const r = explain(pk, notes);
          const gain = r.score - base.score;

      if (!m[i]) continue;
      const w = []; for (let j = i - 2; j <= i + 2; j++) if (m[j]) w.push(m[j]);

    }
    return out;
  }

/* ===== Audio: sounds out (tones, guitar, clicks) and sound in (mic / recordings) ===== */
const Audio = (() => {
  let ctx = null, master = null, voiceWave = null;

    }

  }
  /* a soft, voice-like reference tone */
  function tone(midi, dur = 1.2, when = 0, vol = 0.32) {
    const c = ac(), t = c.currentTime + 0.02 + when;
    const o = c.createOscillator(), g = c.createGain(), lp = c.createBiquadFilter();
    o.setPeriodicWave(voiceWave); o.frequency.value = DSP.m2f(midi);
    lp.type = 'lowpass'; lp.frequency.value = 2200;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 0.05);
    g.gain.setValueAtTime(vol, t + dur - 0.15); g.gain.linearRampToValueAtTime(0, t + dur);
    o.connect(lp); lp.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.05);
    return t + dur;
  }
  /* Karplus–Strong plucked string, rendered once per note */
  function ksBuffer(midi) {
    const key = Math.round(midi * 100);
    if (ksCache.has(key)) return ksCache.get(key);
    const c = ac(), sr = c.sampleRate, dur = 2.4, n = Math.round(sr * dur);
    const P = sr / DSP.m2f(midi) + 0.5, L = Math.floor(P), frac = P - L, C = (1 - frac) / (1 + frac);
    const ring = new Float32Array(L);
    let s = 7 + key; const rnd = () => ((s = (s * 16807) % 2147483647) / 2147483647) * 2 - 1;
    for (let i = 0; i < L; i++) ring[i] = rnd();
    for (let k = 0; k < 2; k++) for (let i = 1; i < L; i++) ring[i] = 0.5 * (ring[i] + ring[i - 1]); // softer pluck

    const idx = [0, 1, 2, 3, 4, 5]; if (up) idx.reverse();

  }
  function click(when, accent) {
    const c = ac(), o = c.createOscillator(), g = c.createGain();

    g.gain.setValueAtTime(0.0001, when); g.gain.exponentialRampToValueAtTime(accent ? 0.5 : 0.3, when + 0.002);

  }

  /* ---- Microphone ---- */
  const mic = { stream: null, an: null, buf: null, live: false, blocked: false, why: '' };
  async function micStart() {
    if (mic.live) return true;
    if (mic.blocked) return false;
    try {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('unsupported');
      const c = ac();

  }
  function micRaw() { if (!mic.an) return null; mic.an.getFloatTimeDomainData(mic.buf); return { x: mic.buf.slice(), sr: ctx.sampleRate }; }

  /* ---- Recordings (voice memo / video) ---- */
  async function decodeFile(file) {
    const c = ac(), data = await file.arrayBuffer();
    const b = await new Promise((res, rej) => { const p = c.decodeAudioData(data, res, rej); if (p && p.then) p.then(res, rej); });

    return { x, sr: b.sampleRate, dur: b.duration };
  }
  return { ac, tone, pluck, strum, click, mic, micStart, micStop, micFrame, micRaw, decodeFile, now: () => ac().currentTime };
})();

function singMatch(el, p) {
  const tol = S.set.tol, drone = !!p.drone;
  el.innerHTML = `<div class="card"><div class="row" style="justify-content:space-between"><div><span class="sub">${drone ? 'Hum the home note of' : 'Sing this note'}</span><div style="font-size:34px;font-weight:700;line-height:1.1" id="tgt">–</div></div>
    <div class="row"><button class="btn alt" id="again">Hear it again</button><button class="btn ghost" id="next">New note</button></div></div>
    <div class="hold" aria-hidden="true"><i id="hold"></i></div><p class="sub" style="margin:0" id="say">Press start, listen, then sing “oo”.</p></div>
    ${traceBlock()}<div style="margin-top:12px" id="lis"></div>
    <div class="stats"><div><b id="sN">0</b>notes</div><div><b id="sOk">0</b>matched</div><div><b id="sE">–</b>avg off</div></div>`;
  const tr = Trace($('canvas', el)), pr = PitchReader();
  const M = { t: null, chord: null, phase: 'idle', hold: 0, n: 0, ok: 0, errs: [], all: [] };
  const r = singRange();
  const pick = () => {
    if (drone) {
      const pool = learnedChords().filter((c) => !c.includes('7')); const list = pool.length ? pool : ['G', 'C', 'D', 'Em', 'A'];
      M.chord = list[Math.floor(Math.random() * list.length)]; const root = DSP.NAMES.findIndex((n) => n === M.chord.replace('m', '').replace('maj7', ''));
      let m = r.lo + 2 + ((root - (r.lo + 2)) % 12 + 12) % 12; M.t = m;
    } else {
      const lo = r.lo + 2, hi = r.hi - 3; let m = M.t == null ? Math.round((lo + hi) / 2) : M.t + [-4, -3, -2, 2, 3, 4, 5][Math.floor(Math.random() * 7)];
      M.t = clamp(m, lo, hi);
    }
    $('#tgt').textContent = drone ? `${M.chord} → ${DSP.name(M.t)}` : DSP.name(M.t);
    tr.set({ target: M.t, lo: M.t - 6, hi: M.t + 6, tol });
  };
  const play = () => {
    M.phase = 'play'; $('#say').textContent = 'Listen…'; M.hold = 0; M.errs = []; $('#hold').style.width = '0%'; $('#msg').textContent = ''; noteOverlay(0);
    let end = 0; if (drone) { Audio.strum(CHORDS[M.chord].shape); end = Audio.tone(M.t, 1.2, 1.0); } else end = Audio.tone(M.t, 1.3);
    setTimeout(() => { if (M.phase === 'play') { M.phase = 'listen'; pr.reset(); $('#say').textContent = 'Your turn — sing and hold it in the band.'; } }, (end - Audio.now()) * 1000 + 180);
  };
  const won = () => {
    M.phase = 'won'; M.n++; M.ok++; const e = M.errs.reduce((a, b) => a + b, 0) / M.errs.length; M.all.push(e);
    $('#sN').textContent = M.n; $('#sOk').textContent = M.ok; $('#sE').textContent = Math.round(M.all.reduce((a, b) => a + b, 0) / M.all.length) + 'c';
    $('#say').innerHTML = `<b class="c-ok">Matched!</b> On average ${Math.round(e)} cents away.`; chime();
    setTimeout(() => { if (M.phase === 'won') { pick(); play(); } }, 1500);
  };
  $('#again').onclick = () => { if (M.t == null) pick(); play(); };
  $('#next').onclick = () => { if (M.phase === 'listen' && M.t != null) { M.n++; $('#sN').textContent = M.n; } pick(); play(); };
  pick();
  const L = listenUI($('#lis', el), {
    onStart() {
      play();
      loop((dt) => {
        const rd = pr.read(); if (!rd) return;
        const m = rd.f0 ? DSP.f2m(rd.f0) : 0;
        if (M.phase !== 'listen') { tr.push(0); return; }
        tr.push(m); noteOverlay(m, M.t, tol);
        if (!m) { M.hold = Math.max(0, M.hold - dt * 0.5); }
        else {
          activity('voice');
          const d = (m - M.t) * 100, f = octaveFold(d), inB = Math.abs(d) <= tol || (Math.abs(f) <= tol && Math.abs(d) >= 900);
          if (inB) { M.hold += dt; M.errs.push(Math.abs(f)); if (Math.abs(d) >= 900) $('#msg').textContent = `Same note, one octave ${d < 0 ? 'lower' : 'higher'} — that counts.`; else $('#msg').textContent = ''; }
          else M.hold = Math.max(0, M.hold - dt * 0.5);
          if (M.hold >= 2) won();
        }
        $('#hold').style.width = Math.min(100, (M.hold / 2) * 100) + '%';
      });
    },
    onStop() { stopLoop(); M.phase = 'idle'; },
    fileHint: 'Press <b>Hear it again</b>, then record yourself singing that note for 3 seconds.',
    onFile(a) {
      const t = DSP.track(a.x, a.sr); const pts = t.map((f) => ({ t: f.t, m: f.f0 ? DSP.f2m(f.f0) : 0 }));
      tr.load(pts, a.dur); const v = pts.filter((x) => x.m);
      if (v.length < 5) return toast('No clear singing found in that recording.');
      const ds = v.map((x) => octaveFold((x.m - M.t) * 100)); const inb = ds.filter((d) => Math.abs(d) <= tol).length / ds.length;
      const med = ds.slice().sort((x, y) => x - y)[ds.length >> 1];
      M.n++; if (inb > 0.5) M.ok++; M.all.push(Math.abs(med)); $('#sN').textContent = M.n; $('#sOk').textContent = M.ok; $('#sE').textContent = Math.round(Math.abs(med)) + 'c';
      $('#say').innerHTML = inb > 0.5 ? `<b class="c-ok">Matched</b> for ${Math.round(inb * 100)}% of the time.` : `Mostly <b class="${med < 0 ? 'c-low' : 'c-high'}">${med < 0 ? 'too low' : 'too high'}</b> (about ${Math.round(Math.abs(med))} cents). ${med < 0 ? 'Aim a little higher.' : 'Aim a little lower.'}`;
      activity('voice');
    }
  });
  onLeave(() => { L.stop(); stopAll(); if (M.n) { S.sing.push({ d: dayKey(), mode: drone ? 'home note' : 'match', n: M.n, ok: M.ok, e: M.all.length ? Math.round(M.all.reduce((a, b) => a + b, 0) / M.all.length) : null }); S.sing = S.sing.slice(-120); save(); } });
}

function singSong(el, p) {
  const key = p.mel || singSong.key || 'five'; singSong.key = key;
  const mel = MELODIES[key], base = keyFor(mel.notes), seq = mel.notes.map((n) => base + n), tol = S.set.tol;
  el.innerHTML = `<div class="chips">${Object.entries(MELODIES).map(([k, m]) => `<button data-mel="${k}" aria-pressed="${k === key}">${esc(m.name)}</button>`).join('')}</div>
    <div class="card"><div class="row" style="justify-content:space-between"><span class="sub">Key note: <b>${DSP.name(base)}</b> · tap a bubble to hear it</span>
    <label class="row" style="gap:6px;font-size:15px"><input type="checkbox" id="auto" checked style="width:22px;height:22px"> Play each note first</label></div>
    <div class="bubbles" id="bub">${seq.map((m, i) => `<button data-i="${i}">${esc(mel.syl[i])}<small>${DSP.name(m).replace(/\d/, '')}</small></button>`).join('')}</div>
    <div class="row"><button class="btn alt" id="whole">Hear the whole tune</button><button class="btn ghost" id="restart">Start over</button></div>
    <div class="hold"><i id="hold"></i></div><p class="sub" style="margin:0" id="say">The app waits for you on every note. Go slowly.</p></div>
    ${traceBlock()}<div style="margin-top:12px" id="lis"></div>`;
  $$('[data-mel]', el).forEach((b) => (b.onclick = () => go({ v: 'sing', mode: 'song', mel: b.dataset.mel })));
  const tr = Trace($('canvas', el)), pr = PitchReader();
  tr.set({ lo: Math.min(...seq) - 3, hi: Math.max(...seq) + 3, tol });
  const G = { i: 0, hold: 0, errs: [], res: [], phase: 'idle' };
  const mark = () => $$('#bub button').forEach((b, i) => { b.className = (i === G.i && G.phase !== 'done' ? 'cur ' : '') + (G.res[i] == null ? '' : Math.abs(G.res[i]) <= tol * 0.6 ? 'ok' : G.res[i] < 0 ? 'lo' : 'hi'); });
  const target = () => { tr.set({ target: seq[G.i] }); mark(); };
  const playCur = () => { G.phase = 'play'; noteOverlay(0); $('#hold').style.width = '0%'; const end = Audio.tone(seq[G.i], 0.9); setTimeout(() => { if (G.phase === 'play') { G.phase = 'listen'; pr.reset(); } }, (end - Audio.now()) * 1000 + 150); };
  const advance = () => {
    G.res[G.i] = G.errs.reduce((a, b) => a + b, 0) / G.errs.length; G.i++; G.hold = 0; G.errs = [];
    if (G.i >= seq.length) {
      G.phase = 'done'; mark(); chime(); const ok = G.res.filter((e) => Math.abs(e) <= tol * 0.6).length;
      $('#say').innerHTML = `<b class="c-ok">Finished!</b> ${ok} of ${seq.length} notes right in the middle. Blue = a bit low, orange = a bit high.`;
      S.sing.push({ d: dayKey(), mode: mel.name, n: seq.length, ok, e: Math.round(G.res.reduce((a, b) => a + Math.abs(b), 0) / seq.length) }); S.sing = S.sing.slice(-120); save(); return;
    }
    target(); if ($('#auto').checked) playCur(); else { G.phase = 'listen'; pr.reset(); }
  };
  $$('#bub button').forEach((b) => (b.onclick = () => Audio.tone(seq[+b.dataset.i], 0.8)));
  $('#whole').onclick = () => seq.forEach((m, i) => Audio.tone(m, 0.5, i * 0.55));
  $('#restart').onclick = () => { G.i = 0; G.res = []; G.hold = 0; G.errs = []; G.phase = L.isOn() ? 'play' : 'idle'; target(); if (L.isOn()) playCur(); $('#say').textContent = 'From the top.'; };
  target();
  const L = listenUI($('#lis', el), {
    onStart() {
      if (G.phase === 'done') { G.i = 0; G.res = []; } target(); playCur();
      loop((dt) => {
        const rd = pr.read(); if (!rd) return; const m = rd.f0 ? DSP.f2m(rd.f0) : 0;
        if (G.phase !== 'listen') { tr.push(0); return; }
        tr.push(m); noteOverlay(m, seq[G.i], tol);
        if (m) {
          activity('voice'); const d = (m - seq[G.i]) * 100;
          if (Math.abs(d) <= tol) { G.hold += dt; G.errs.push(d); } else G.hold = Math.max(0, G.hold - dt);
          if (G.hold >= 0.6) advance();
        }
        $('#hold').style.width = Math.min(100, (G.hold / 0.6) * 100) + '%';
      });
    },
    onStop() { stopLoop(); if (G.phase !== 'done') G.phase = 'idle'; },
    fileHint: 'Sing the tune slowly, with a short gap between notes.',
    onFile(a) {
      const t = DSP.track(a.x, a.sr); tr.set({ target: null }); tr.load(t.map((f) => ({ t: f.t, m: f.f0 ? DSP.f2m(f.f0) : 0 })), a.dur);
      const segs = segments(t); if (segs.length < 2) return toast('I couldn’t find separate notes. Leave short gaps between notes.');
      G.res = []; let j = 0;
      seq.forEach((m, i) => { // match each target to the next sung note near it
        while (j < segs.length && Math.abs(octaveFold((segs[j].m - m) * 100)) > 250 && j < segs.length - (seq.length - i)) j++;
        if (j < segs.length) { G.res[i] = octaveFold((segs[j].m - m) * 100); j++; }
      });
      G.phase = 'done'; G.i = seq.length; mark();
      const ok = G.res.filter((e) => e != null && Math.abs(e) <= tol * 0.6).length;
      $('#say').innerHTML = `From your recording: <b>${ok} of ${seq.length}</b> notes right in the middle.`; activity('voice');
    }
  });
  onLeave(() => { L.stop(); stopAll(); });
}
/* split a pitch track into held notes */
function segments(t) {
  const out = []; let cur = null;
  t.forEach((o) => {
    if (!o.f0) { if (cur && cur.ms.length >= 5) out.push(cur); cur = null; return; }
    const m = DSP.f2m(o.f0);
    if (cur && Math.abs(m - cur.m) < 0.6) { cur.ms.push(m); const s = cur.ms.slice().sort((a, b) => a - b); cur.m = s[s.length >> 1]; cur.t1 = o.t; }
    else { if (cur && cur.ms.length >= 5) out.push(cur); cur = { m, ms: [m], t0: o.t, t1: o.t }; }
  });
  if (cur && cur.ms.length >= 5) out.push(cur);
  return out;
}

function singFree(el) {
  el.innerHTML = `<p class="sub">Do a slow <b>siren</b> on a lip trill or “ng”: low → high → low. The line shows your voice.</p>${traceBlock()}<div style="margin-top:12px" id="lis"></div>`;
  const r = singRange(), tr = Trace($('canvas', el)), pr = PitchReader();
  tr.set({ lo: r.lo - 2, hi: r.hi + 2, follow: true, target: null });
  const L = listenUI($('#lis', el), {
    onStart() { loop(() => { const rd = pr.read(); if (!rd) return; const m = rd.f0 ? DSP.f2m(rd.f0) : 0; tr.push(m); noteOverlay(m, null); if (m) activity('voice'); }); },
    onStop: stopLoop,
    onFile(a) { const t = DSP.track(a.x, a.sr); const pts = t.map((f) => ({ t: f.t, m: f.f0 ? DSP.f2m(f.f0) : 0 })); const v = pts.filter((x) => x.m).map((x) => x.m); if (v.length) tr.set({ lo: Math.min(...v) - 2, hi: Math.max(...v) + 2, follow: false }); tr.load(pts, a.dur); activity('voice'); }
  });
  onLeave(() => { L.stop(); stopAll(); });
}

function singRangeMode(el) {
  const R = { step: 'low', vals: [], lo: S.range ? S.range.lo : null, hi: S.range ? S.range.hi : null, t: 0 };
  el.innerHTML = `<div class="card"><h3 id="rh">Step 1: your lowest easy note</h3>
    <p id="rp">Sing “ah” and slide <b>down slowly</b>. Stop where it starts to feel croaky. Don’t push.</p>
    <div class="row" style="align-items:baseline;gap:16px"><span style="font-size:40px;font-weight:700" id="rn">–</span><span class="sub" id="rs"></span></div>
    <div class="row" style="margin-top:8px"><button class="btn alt" id="rdone">That’s my edge</button><button class="btn ghost" id="rskip">Switch step</button></div></div>
    <div id="lis"></div><div class="art" id="rk" style="margin-top:12px"></div><div id="rres"></div>`;
  const pr = PitchReader({ smooth: 7 });
  const kb = () => keyboard($('#rk'), 40, 79, { labels: true, mark: (m) => R.lo != null && R.hi != null && m >= R.lo && m <= R.hi });
  const res = () => {
    $('#rs').textContent = `lowest ${R.lo != null ? DSP.name(R.lo) : '–'} · highest ${R.hi != null ? DSP.name(R.hi) : '–'}`; kb();
    if (R.lo != null && R.hi != null) {
      $('#rres').innerHTML = `<div class="result good"><b>Your easy range: ${DSP.name(R.lo)} to ${DSP.name(R.hi)}</b> (${R.hi - R.lo} steps). Songs will be set to fit inside it.<div class="row" style="margin-top:8px"><button class="btn ok" id="rsave">Save my range</button></div></div>`;
      $('#rsave').onclick = () => { S.range = { lo: R.lo, hi: R.hi }; save(); toast('Range saved'); go({ v: 'sing', mode: 'match' }); };
    }
  };
  const fin = () => {
    if (R.vals.length > 6) { const s = R.vals.slice().sort((a, b) => a - b); if (R.step === 'low') R.lo = Math.round(s[Math.floor(s.length * 0.08)]); else R.hi = Math.round(s[Math.floor(s.length * 0.92)]); }
    R.vals = []; R.step = R.step === 'low' ? 'high' : 'low';
    $('#rh').textContent = R.step === 'low' ? 'Step 1: your lowest easy note' : 'Step 2: your highest easy note';
    $('#rp').innerHTML = R.step === 'low' ? 'Sing “ah” and slide <b>down slowly</b>. Stop where it starts to feel croaky.' : 'Now slide <b>up slowly</b> on “ah” or “oo”. Stop before it strains or squeaks.';
    res();
  };
  $('#rdone').onclick = fin; $('#rskip').onclick = () => { R.vals = []; fin(); };
  res();
  const L = listenUI($('#lis', el), {
    onStart() { loop(() => { const rd = pr.read(); if (!rd || !rd.f0) return; const m = DSP.f2m(rd.f0); if (m < 36 || m > 84) return; activity('voice'); R.vals.push(m); $('#rn').textContent = DSP.name(m); }); },
    onStop: stopLoop,
    fileHint: 'Slide from your lowest to your highest easy note on “ah”.',
    onFile(a) { const v = DSP.track(a.x, a.sr).filter((f) => f.f0).map((f) => DSP.f2m(f.f0)).sort((x, y) => x - y); if (v.length < 10) return toast('Not enough singing found.'); R.lo = Math.round(v[Math.floor(v.length * 0.05)]); R.hi = Math.round(v[Math.floor(v.length * 0.95)]); res(); }
  });
  onLeave(() => { L.stop(); stopAll(); });
}

function earGame(el, p) {
  const mode = p.ear || earGame.mode || 'hl'; earGame.mode = mode;
  const ORDER = [5, 4, 2, 0, 3, 1];
  el.innerHTML = `<div class="chips">${[['hl', 'Higher or lower?'], ['sd', 'Same or different?'], ['iv', 'Name the jump']].map(([k, l]) => `<button data-e="${k}" aria-pressed="${k === mode}">${l}</button>`).join('')}</div>
    <div class="card" style="text-align:center"><p class="sub" id="eq">Listen to two notes.</p>
    <button class="btn big" id="eplay" style="min-width:200px">Play</button>
    <div class="row" id="eans" style="justify-content:center;margin-top:16px"></div>
    <div class="result info hidden" id="efb" aria-live="polite"></div></div>
    <div class="stats"><div><b id="es">0</b>in a row</div><div><b id="er">0/0</b>right</div><div><b id="el">–</b>level</div></div>
    <p class="sub">No mic needed. Use headphones if you can.</p>`;
  $$('[data-e]', el).forEach((b) => (b.onclick = () => go({ v: 'sing', mode: 'ear', ear: b.dataset.e })));
  const r = singRange(); let Q = null, st = 0, right = 0, tot = 0, recent = [];
  const lvl = () => { $('#el').textContent = mode === 'hl' ? S.ear.hl + ' st' : mode === 'sd' ? Math.round(S.ear.sd) + 'c' : S.ear.iv + '/6'; };
  const pool = () => ORDER.slice(0, clamp(S.ear.iv, 2, 6)).map((i) => INTERVALS[i]);
  const make = () => {
    const a = Math.round(r.lo + 3 + Math.random() * Math.max(1, r.hi - r.lo - 9));
    if (mode === 'hl') { const up = Math.random() < 0.5; Q = { a, b: a + (up ? 1 : -1) * S.ear.hl, ans: up ? 'Higher' : 'Lower', opts: ['Lower', 'Higher'] }; }
    else if (mode === 'sd') { const same = Math.random() < 0.4; Q = { a, b: same ? a : a + (Math.random() < 0.5 ? 1 : -1) * S.ear.sd / 100, ans: same ? 'Same' : 'Different', opts: ['Same', 'Different'] }; }
    else { const P = pool(), iv = P[Math.floor(Math.random() * P.length)]; Q = { a, b: a + iv.st, ans: iv.name, cue: iv.cue, opts: P.map((x) => x.name) }; }
    $('#eans').innerHTML = Q.opts.map((o) => `<button class="btn alt big" data-a="${esc(o)}">${esc(o)}</button>`).join('');
    $$('#eans [data-a]').forEach((b) => (b.onclick = () => answer(b.dataset.a)));
    $('#efb').classList.add('hidden'); Q.done = false;
  };
  const play = () => { if (!Q) make(); Audio.tone(Q.a, 0.7, 0, 0.3); Audio.tone(Q.b, 0.7, 0.85, 0.3); $('#eq').textContent = mode === 'iv' ? 'Which jump was that?' : mode === 'hl' ? 'Was the second note higher or lower?' : 'Were they the same note?'; };
  const answer = (a) => {
    if (!Q || Q.done) return; Q.done = true; tot++; activity('ear');
    const ok = a === Q.ans; recent.push(ok); recent = recent.slice(-10);
    if (ok) { st++; right++; } else st = 0;
    if (mode === 'hl') { if (ok && st % 3 === 0) S.ear.hl = Math.max(1, S.ear.hl - 1); if (!ok) S.ear.hl = Math.min(12, S.ear.hl + 1); }
    if (mode === 'sd') { if (ok && st % 3 === 0) S.ear.sd = Math.max(10, S.ear.sd * 0.75); if (!ok) S.ear.sd = Math.min(200, S.ear.sd * 1.3); }
    if (mode === 'iv' && recent.length === 10 && recent.filter(Boolean).length >= 8 && S.ear.iv < 6) { S.ear.iv++; recent = []; toast('New jump unlocked: ' + INTERVALS[ORDER[S.ear.iv - 1]].name); }
    S.ear.best = Math.max(S.ear.best || 0, st); save();
    const fb = $('#efb'); fb.classList.remove('hidden'); fb.className = 'result ' + (ok ? 'good' : 'close');
    fb.innerHTML = (ok ? '<b>Yes!</b> ' : `<b>Not quite</b> — it was <b>${esc(Q.ans)}</b>. `) + (Q.cue ? esc(Q.cue) + '. ' : '') + '<button class="btn alt" id="enext" style="margin-left:8px">Next</button>';
    $('#enext').onclick = () => { make(); play(); };
    if (!ok) setTimeout(() => { Audio.tone(Q.a, 0.6, 0, 0.3); Audio.tone(Q.b, 0.6, 0.7, 0.3); }, 250);
    $('#es').textContent = st; $('#er').textContent = right + '/' + tot; lvl();
  };
  $('#eplay').onclick = () => { if (!Q || Q.done) make(); play(); };
  lvl();
}

/* ================= CHORDS ================= */
function chordSVG(label, o = {}) {
  const ch = CHORDS[label], left = S.set.left, X = (i) => 30 + (left ? 5 - i : i) * 28, top = 46, fh = 38, frets = 5;
  const st = o.status || [], hl = o.hl;
  let s = `<svg viewBox="0 0 200 ${o.notes ? 290 : 274}" role="img" aria-label="${label} chord diagram">`;
  for (let f = 0; f <= frets; f++) s += `<line x1="30" x2="170" y1="${top + f * fh}" y2="${top + f * fh}" stroke="currentColor" stroke-width="${f ? 2 : 7}" opacity="${f ? .45 : 1}"/>`;
  for (let i = 0; i < 6; i++) s += `<line x1="${X(i)}" x2="${X(i)}" y1="${top}" y2="${top + frets * fh}" stroke="${hl === i ? 'var(--wood)' : 'currentColor'}" stroke-width="${hl === i ? 5 : 3.2 - i * 0.35}" opacity="${hl === i ? 1 : .8}"/>`;
  ch.shape.forEach((f, i) => {
    if (f < 0) s += `<text x="${X(i)}" y="${top - 14}" text-anchor="middle" font-size="18" font-weight="700" fill="currentColor" opacity=".7">×</text>`;
    else if (f === 0) s += `<circle cx="${X(i)}" cy="${top - 19}" r="7" fill="none" stroke="currentColor" stroke-width="2.4"/>`;
    else s += `<circle cx="${X(i)}" cy="${top + (f - 0.5) * fh}" r="12.5" fill="var(--wood)"/><text x="${X(i)}" y="${top + (f - 0.5) * fh + 5.5}" text-anchor="middle" font-size="15" font-weight="700" fill="#fff7f0">${ch.fingers[i] || ''}</text>`;
    const stt = st[i];

    <div class="card"><h3>Practice minutes, last 7 days</h3><div class="bars">${days.map((x, i) => `<div class="${i === 6 ? 'cur' : ''}"><span>${x.m || ''}</span><i style="height:${(x.m / mx) * 100}%"></i>${x.l}</div>`).join('')}</div>
      <p class="sub" style="margin:4px 0 0">Counted only while you play, sing or answer — not while the app sits open.</p></div>
    <div class="card"><h3>One-minute changes</h3>${omcRows.length ? `<table><thead><tr><th>Pair</th><th class="n">Best</th><th class="n">Last</th><th class="n">Tries</th></tr></thead><tbody>${omcRows.map((r) => `<tr><td>${r.k.replace('-', ' ↔ ')}</td><td class="n"><b>${r.best}</b></td><td class="n">${r.last}</td><td class="n">${r.n}</td></tr>`).join('')}</tbody></table>` : '<p class="sub">None yet — find them under Chords.</p>'}</div>
    <div class="card"><h3>Singing</h3>${sing.length ? `<table><thead><tr><th>Exercise</th><th class="n">Matched</th><th class="n">Avg off</th></tr></thead><tbody>${sing.map((r) => `<tr><td>${esc(r.mode)} <span class="sub">${r.d.slice(5)}</span></td><td class="n">${r.ok}/${r.n}</td><td class="n">${r.e == null ? '–' : r.e + 'c'}</td></tr>`).join('')}</tbody></table>` : '<p class="sub">No singing sessions yet.</p>'}
      <p class="sub" style="margin:8px 0 0">100 cents = one note step. Under 25 cents sounds in tune to most listeners.</p></div>
    <div class="card"><h3>Voice range</h3><p>${S.range ? `<b>${DSP.name(S.range.lo)} – ${DSP.name(S.range.hi)}</b>` : 'Not measured yet.'} <a href="#sing" id="mr">Measure</a></p>
      <p class="sub" style="margin:0">Ear game level: higher/lower gap ${S.ear.hl} steps · best streak ${S.ear.best || 0}</p></div>
    <div class="card set"><h2>Settings</h2>
      <label>How close counts as “on the note”<select id="tol" class="btn alt">${[[50, 'Relaxed ±50c'], [35, 'Getting there ±35c'], [20, 'Precise ±20c']].map(([v, l]) => `<option value="${v}" ${S.set.tol === v ? 'selected' : ''}>${l}</option>`).join('')}</select></label>
      <label>Left-handed chord boxes<input type="checkbox" id="left" ${S.set.left ? 'checked' : ''} style="width:26px;height:26px"></label>
      <label>Voice<select id="voice" class="btn alt"><option value="">Not set</option><option value="low" ${S.set.voice === 'low' ? 'selected' : ''}>Lower</option><option value="high" ${S.set.voice === 'high' ? 'selected' : ''}>Higher</option></select></label>
      <label>Reference pitch (A4)<span class="row"><button class="iconbtn" id="a4m">−</button><b id="a4v">${S.set.a4} Hz</b><button class="iconbtn" id="a4p">+</button></span></label>
      <p class="sub" style="margin:0">${syncWhere === 'account' ? 'Progress is saved to your account.' : 'Progress is saved in this browser only.'}</p>
      <div><button class="btn ghost" id="reset">Reset all progress</button><div id="rconf"></div></div></div></div>`;
  $('#mr').onclick = (e) => { e.preventDefault(); go({ v: 'sing', mode: 'range' }); };
  $('#tol').onchange = (e) => { S.set.tol = +e.target.value; save(); };
  $('#left').onchange = (e) => { S.set.left = e.target.checked; save(); };
  $('#voice').onchange = (e) => { S.set.voice = e.target.value; save(); };
  const a4 = (v) => { S.set.a4 = clamp(v, 430, 450); DSP.state.a4 = S.set.a4; $('#a4v').textContent = S.set.a4 + ' Hz'; save(); };
  $('#a4m').onclick = () => a4(S.set.a4 - 1); $('#a4p').onclick = () => a4(S.set.a4 + 1);
  $('#reset').onclick = () => { $('#rconf').innerHTML = `<p style="margin:10px 0 6px">This clears lessons, scores and your range. Sure?</p><div class="row"><button class="btn" id="ry">Yes, reset</button><button class="btn alt" id="rn">Keep it</button></div>`; $('#ry').onclick = () => { S = DEF(); DSP.state.a4 = 440; save(); toast('Progress reset'); renderProgress(); }; $('#rn').onclick = () => ($('#rconf').innerHTML = ''); };
}

/* ================= boot ================= */
$('#tabs').innerHTML = [['learn', 'Learn'], ['tune', 'Tune'], ['sing', 'Sing'], ['chords', 'Chords'], ['rhythm', 'Rhythm']].map(([v, l]) => `<a href="#${v}" data-v="${v}">${ICON[v]}<span>${l}</span></a>`).join('');
$('#progbtn').innerHTML = ICON.progress;
window.addEventListener('hashchange', route);
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
route(); micChip(); initRemote();

}
</script></body></html>
